# GamiBAR — Render Static Site
# If this service was created via the Dashboard (not Blueprint), you MUST also add
# Redirects/Rewrites → Source: /*  Destination: /index.html  Action: Rewrite
services:
  - type: web
    name: gamibar
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      # Dynamic room / play paths (no physical HTML files)
      - type: rewrite
        source: /author/room/*
        destination: /index.html
      - type: rewrite
        source: /play/*
        destination: /index.html
      # Catch-all SPA fallback (client-side routes)
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=(), payment=(), usb=()
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.clarity.ms https://*.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://twluyjazkesmrnvlcvtd.supabase.co wss://twluyjazkesmrnvlcvtd.supabase.co https://www.google-analytics.com https://*.google-analytics.com https://www.clarity.ms https://*.clarity.ms; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self' https://accounts.google.com
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Set these in the Render Dashboard (build-time Vite embeds them):
      # VITE_SUPABASE_URL
      # VITE_SUPABASE_ANON_KEY
      # VITE_PUBLIC_APP_URL
      # VITE_GOOGLE_SITE_VERIFICATION
      # VITE_BING_SITE_VERIFICATION
      # VITE_GA_MEASUREMENT_ID
      # VITE_MICROSOFT_CLARITY_ID
